name: Scan Amazon Deals

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6,14,22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: amazon-deal-scanner
  cancel-in-progress: false

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Scan Amazon deals
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          python src/scanner.py

      - name: Save results
        run: |

          git config user.name \
          "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
          data/deals.json \
          data/history.json \
          docs/index.html

          if git diff --cached --quiet
          then

            echo "No changes"

          else

            git commit \
            -m "Update Amazon deals"

            git push

          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs


  deploy:

    needs: scan

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
