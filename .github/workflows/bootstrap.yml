name: Install Amazon Deal Finder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Unpack project
        run: |
          unzip -o amazon-extreme-deal-finder-upload.zip
          rm -f amazon-extreme-deal-finder-upload.zip
          rm -f .github/workflows/bootstrap.yml

      - name: Commit installed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Amazon extreme deal finder"
          git push
