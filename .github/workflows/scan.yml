name: Scan Amazon Extreme Deals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: amazon-extreme-deal-pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Scan Amazon for 90%+ deals with Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python src/scanner.py

      - name: Save latest deals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/deals.json docs/index.html

          if git diff --cached --quiet; then
            echo "No deal changes to commit"
          else
            git commit -m "Update Amazon extreme deals"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload deal website
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: scan
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Amazon deal website
        id: deployment
        uses: actions/deploy-pages@v5
