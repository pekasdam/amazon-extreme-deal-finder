name: EM Property Group TTS Video 3 Exact Sync

on:
  push:
    branches:
      - em-tts-video3
    paths:
      - 'em_tts/video3_segments.txt'
      - '.github/workflows/em-tts-video1.yml'

permissions:
  contents: read

jobs:
  generate-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Piper and ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Joe voice
        run: |
          mkdir -p voices
          python -m piper.download_voices en_US-joe-medium --data-dir voices

      - name: Split script into exact visual scenes
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('em_tts/video3_segments.txt').read_text()
          parts = [p.strip() for p in text.split('===SCENE===') if p.strip()]
          assert len(parts) == 29, f'Expected 29 scenes, found {len(parts)}'
          out = Path('scene_text')
          out.mkdir(exist_ok=True)
          for i, part in enumerate(parts, 1):
              (out / f'scene_{i:02d}.txt').write_text(part + '\n')
          print(f'Created {len(parts)} narration scenes')
          PY

      - name: Generate one narration file per visual scene
        run: |
          mkdir -p scene_audio
          : > scene_durations.csv
          echo 'scene,duration_seconds' >> scene_durations.csv
          for txt in scene_text/scene_*.txt; do
            base=$(basename "$txt" .txt)
            python -m piper \
              -m en_US-joe-medium \
              --data-dir voices \
              --sentence-silence 0.12 \
              --input-file "$txt" \
              -f "scene_audio/${base}.wav"
            dur=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "scene_audio/${base}.wav")
            echo "${base},${dur}" >> scene_durations.csv
          done

      - name: Concatenate scene narration and master audio
        run: |
          : > audio_concat.txt
          for wav in scene_audio/scene_*.wav; do
            echo "file '$PWD/$wav'" >> audio_concat.txt
          done
          ffmpeg -y -f concat -safe 0 -i audio_concat.txt -c copy EM_Property_Group_Video3_Segmented_Raw.wav
          ffmpeg -y -i EM_Property_Group_Video3_Segmented_Raw.wav \
            -af "highpass=f=70,lowpass=f=12000,acompressor=threshold=-20dB:ratio=2.2:attack=8:release=90,loudnorm=I=-16:TP=-1.5:LRA=9" \
            -ar 24000 -ac 1 \
            EM_Property_Group_Video3_EXACT_SYNC_Narration.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 EM_Property_Group_Video3_EXACT_SYNC_Narration.wav > total_duration.txt
          cat scene_durations.csv
          cat total_duration.txt

      - name: Upload exact-sync narration
        uses: actions/upload-artifact@v4
        with:
          name: EM-Property-Group-Video3-Exact-Sync-Narration
          path: |
            EM_Property_Group_Video3_EXACT_SYNC_Narration.wav
            scene_durations.csv
            total_duration.txt
          retention-days: 1
